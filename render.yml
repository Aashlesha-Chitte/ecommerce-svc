services:
  - type: web
    name: ecommerce-svc
    runtime: node
    buildCommand: npm install && npm run build && npm install -g tsc-watch
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max_old_space_size=4096
      - key: NODE_VERSION
        value: 18.x
