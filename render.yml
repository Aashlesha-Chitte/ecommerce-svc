services:
  - type: web
    name: ecommerce-svc
    runtime: node
    branch: develop
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.x.x
      - key: CORS_ORIGIN
        value: '*'
    plan: free