services:
  - type: web
    name: ecommerce-svc
    runtime: node
    branch: develop
    buildCommand: npm install && npm run build  # Ensure this builds correctly
    startCommand: node ./dist/index.js  # Ensure this points to the correct entry file
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.x.x
      - key: CORS_ORIGIN
        value: '*'
    plan: free